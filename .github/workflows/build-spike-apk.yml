# NEVER DISTRIBUTE THIS APK (LGPD audit B2, 26/09/2026).
# The J-Style spike app is a vendor-SDK test harness. Its manifest asks for
# location, camera, BODY_SENSORS and storage, none of which TumTum needs, and
# it is signed with a debug key. It is for the bench phone that runs the
# spike, never for a participant, a fan or anyone outside the project. The
# release it publishes is therefore a prerelease, and the body says so.
name: Build JStyle spike APK

on:
  workflow_dispatch:
  push:
    branches: [claude/jstyle-bracelet-analysis-cm8u8z, claude/samsung-a17-test-fz2nx5]
    paths:
      - "hardware/jstyle-spike/v8test/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: hardware/jstyle-spike/v8test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp hardware/jstyle-spike/v8test/app/build/outputs/apk/debug/app-debug.apk tumtum-spike-v8.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tumtum-spike-v8
          path: tumtum-spike-v8.apk

      - name: Publish APK to the spike-apk release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spike-apk
          name: "Tumtum spike — JStyle V8 raw PPG (APK)"
          prerelease: true
          body: >
            APK de teste para o spike de PPG bruto do JStyle V8, só para o
            celular de bancada do spike. NUNCA distribua: ele pede localização,
            câmera, sensores corporais (BODY_SENSORS) e armazenamento, e não é
            para participante nem para fã.
            Baixe o arquivo tumtum-spike-v8.apk no celular de bancada, instale
            (permitindo "fontes desconhecidas") e siga o guia do spike.
          files: tumtum-spike-v8.apk
