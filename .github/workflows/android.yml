name: Build TumTum APK

on:
  push:
    branches: [app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sinal de que o run começou, legível via git ls-remote (o ambiente que
      # mantém este repo não tem acesso à API do GitHub).
      - name: Sinalizar início
        run: git push -f origin "HEAD:refs/heads/ci-status-b${{ github.run_number }}" || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # O ambiente que edita este repo só fala protocolo git — o log do build é
      # SEMPRE publicado como branch ci-log-bN-exitC, no mesmo passo, antes de
      # o passo reportar sucesso/falha (um passo if:failure separado se mostrou frágil).
      - name: Testes + APK
        run: |
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          mkdir -p /tmp/cilog && cp build.log /tmp/cilog/build.log
          printf '{"git":{"deploymentEnabled":false}}\n' > /tmp/cilog/vercel.json
          cd /tmp/cilog
          git init -q -b main
          git config user.name tumtum-ci
          git config user.email ci@users.noreply.github.com
          git add build.log vercel.json
          git commit -qm "log do build ${GITHUB_RUN_NUMBER} exit=${code} [skip ci]"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:refs/heads/ci-log-b${GITHUB_RUN_NUMBER}-exit${code}" || true
          exit "$code"
        env:
          TUMTUM_VERSION_CODE: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tumtum-1.0-b${{ github.run_number }}.apk

      - name: Guardar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: tumtum-apk-b${{ github.run_number }}
          path: tumtum-1.0-b${{ github.run_number }}.apk

      - name: Publicar Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-b${{ github.run_number }}
          name: TumTum app 1.0 — build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            APK de teste (assinatura de debug) para sideload — Android 9+ com Health Connect.

            **Instalar:** baixe o `tumtum-1.0-b${{ github.run_number }}.apk` abaixo no celular,
            toque no arquivo e permita a instalação de fontes desconhecidas quando o
            Android pedir. Builds novos instalam por cima deste sem desinstalar.

            Não é um build de loja — nada de Play Store com esta chave.
          files: tumtum-1.0-b${{ github.run_number }}.apk

      - name: Guardar log como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-b${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
