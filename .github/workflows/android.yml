name: Build TumTum APK

on:
  push:
    branches: [app]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes + APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log
        env:
          TUMTUM_VERSION_CODE: ${{ github.run_number }}

      # O ambiente que edita este repo só fala protocolo git — em caso de falha,
      # o log vira uma branch ci-log-bN para ser lida com git fetch.
      - name: Publicar log de falha
        if: failure()
        run: |
          set -e
          mkdir -p /tmp/cilog
          cp build.log /tmp/cilog/build.log 2>/dev/null || echo "falhou antes do gradle rodar" > /tmp/cilog/build.log
          cd /tmp/cilog
          git init -q -b "ci-log-b${{ github.run_number }}"
          git config user.name tumtum-ci
          git config user.email ci@users.noreply.github.com
          git add build.log
          git commit -qm "log do build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:refs/heads/ci-log-b${{ github.run_number }}"

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tumtum-1.0-b${{ github.run_number }}.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-b${{ github.run_number }}
          name: TumTum app 1.0 — build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            APK de teste (assinatura de debug) para sideload — Android 9+ com Health Connect.

            **Instalar:** baixe o `tumtum-1.0-b${{ github.run_number }}.apk` abaixo no celular,
            toque no arquivo e permita a instalação de fontes desconhecidas quando o
            Android pedir. Builds novos instalam por cima deste sem desinstalar.

            Não é um build de loja — nada de Play Store com esta chave.
          files: tumtum-1.0-b${{ github.run_number }}.apk

      - name: Guardar APK como artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: tumtum-apk-b${{ github.run_number }}
          path: tumtum-1.0-b${{ github.run_number }}.apk
