name: Build TumTum APK

on:
  push:
    branches: [app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes de unidade
        run: ./gradlew --no-daemon :app:testDebugUnitTest
        env:
          TUMTUM_VERSION_CODE: ${{ github.run_number }}

      - name: Montar APK
        run: ./gradlew --no-daemon :app:assembleDebug
        env:
          TUMTUM_VERSION_CODE: ${{ github.run_number }}

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tumtum-1.0-b${{ github.run_number }}.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-b${{ github.run_number }}
          name: TumTum app 1.0 — build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            APK de teste (assinatura de debug) para sideload — Android 9+ com Health Connect.

            **Instalar:** baixe o `tumtum-1.0-b${{ github.run_number }}.apk` abaixo no celular,
            toque no arquivo e permita a instalação de fontes desconhecidas quando o
            Android pedir. Builds novos instalam por cima deste sem desinstalar.

            Não é um build de loja — nada de Play Store com esta chave.
          files: tumtum-1.0-b${{ github.run_number }}.apk

      - name: Guardar APK como artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: tumtum-apk-b${{ github.run_number }}
          path: tumtum-1.0-b${{ github.run_number }}.apk
