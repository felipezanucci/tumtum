name: Build capture APK

# Written without an Android SDK to compile against, so CI is the only place
# this is ever verified. It runs on every push that touches the app.
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-capture-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The parser is the one piece provable without a phone or a sensor, so
      # it is proven before anything is packaged. No `|| true` here: a
      # swallowed failure is a green check that means nothing.
      - name: Run unit tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK after the commit that built it
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/tumtum-captura-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tumtum-captura-apk
          path: dist/*.apk
