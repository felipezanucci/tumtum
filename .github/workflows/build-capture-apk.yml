name: Build capture APK (reference)

# The capture app is the reference while its pieces are ported into the
# designed app (docs/one-app-plan.md); this keeps it building until it goes.
# Written without an Android SDK to compile against, so CI is the only place
# this is ever verified.
on:
  workflow_dispatch:
  push:
    paths:
      - "android-capture/**"
      - ".github/workflows/build-capture-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # The parser is the one piece provable without a phone or a sensor, so
      # it is proven before anything is packaged. No `|| true` here: a
      # swallowed failure is a green check that means nothing.
      - name: Run unit tests
        working-directory: android-capture
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android-capture
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK after the commit that built it
        run: |
          mkdir -p dist
          cp android-capture/app/build/outputs/apk/debug/app-debug.apk \
             "dist/tumtum-captura-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tumtum-captura-apk
          path: dist/*.apk

