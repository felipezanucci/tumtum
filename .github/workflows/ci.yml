name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --passWithNoTests

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Pinned: Ruff's default rule set widens between releases, so an
      # unpinned linter turned an untouched commit from clean to a hundred
      # findings overnight. Bumping this is a deliberate act, with the
      # findings reviewed. The rules themselves live in backend/pyproject.toml.
      - run: pip install ruff==0.15.8 mypy
      - run: ruff check app/
      - run: ruff format --check app/

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: tumtum_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://user:password@localhost/tumtum_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: test-secret-key
      # The placeholder key is fine for tests; the server refuses it anywhere
      # this is not set (app/config.py, secret_key_problem).
      ALLOW_WEAK_SECRET_KEY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # aiosqlite: the feed tests run their queries on an in-memory database.
      # Below 0.21 — newer releases hang under SQLAlchemy 2.0.23.
      - run: pip install pytest pytest-asyncio httpx "aiosqlite<0.21"
      # No `|| echo`: a swallowed failure is a green check that means nothing,
      # which is how the frontend job stayed green while it was broken.
      - run: pytest tests/ -v --tb=short

  # LGPD audit C8 (26/09/2026): real personal data reached this public
  # repository twice — a founder's export in a test fixture, and contacts of
  # third parties in docs. This job keeps new cases out. It needs no secrets
  # and reads only the checkout. It fails with the offending lines.
  #
  # The secret patterns are assembled from pieces so this file never contains
  # them literally (it would otherwise flag itself). docs/decision-log.md is
  # skipped as history; its addresses were scrubbed by hand on 26/09.
  privacy-scan:
    name: Privacy Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No personal e-mails, secrets or Android backups in the tree
        shell: bash
        run: |
          set -uo pipefail
          EXCLUDES=(-I -r -n -E
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=build
            --exclude-dir=.gradle --exclude-dir=.next
            --exclude=package-lock.json --exclude='*.class'
            --exclude=decision-log.md)
          fail=0

          # 1. E-mail addresses outside the allowlist. Company role addresses
          #    (oi@, privacidade@ — the encarregado's channel, docs/dpo.md) and
          #    reserved test domains only; a real person's address never goes in.
          EMAIL='[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
          ALLOW='^(oi@tumtum\.cc|oi@mail\.tumtum\.cc|privacidade@tumtum\.cc|noreply@anthropic\.com|[^@]+@(example\.com|exemplo\.com|teste\.com|x\.cc|email\.com|b\.com|d\.com|dominio\.com\.br))$'
          export ALLOW
          hits=$(grep "${EXCLUDES[@]}" -o "$EMAIL" . \
            | awk '{
                allow = ENVIRON["ALLOW"];
                n = index($0, ":"); rest = substr($0, n + 1);
                m = index(rest, ":"); addr = substr(rest, m + 1);
                if (tolower(addr) !~ allow) print
              }')
          if [ -n "$hits" ]; then
            echo "::error::E-mail addresses outside the allowlist (use @exemplo.com in tests, never a real one):"
            echo "$hits"
            fail=1
          fi

          # 2. Literal secrets.
          AWS='AKIA''[0-9A-Z]{16}'
          STRIPE='sk_''live_'
          RESEND='\bre_''[A-Za-z0-9]{20,}'
          PEM='-----BEG''IN .* PRIV''ATE KEY'
          hits=$(grep "${EXCLUDES[@]}" -e "$AWS" -e "$STRIPE" -e "$RESEND" -e "$PEM" . || true)
          if [ -n "$hits" ]; then
            echo "::error::Something that looks like a secret is committed:"
            echo "$hits"
            fail=1
          fi

          # 3. Android backup of health data (audit AL-2): the app's database
          #    and tokens must never go to Google's backup.
          BACKUP='allowBackup="''true"'
          hits=$(grep -r -n --include=AndroidManifest.xml -F "$BACKUP" android/ || true)
          if [ -n "$hits" ]; then
            echo "::error::android:allowBackup must be false:"
            echo "$hits"
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "Privacy scan: clean."
          exit "$fail"
