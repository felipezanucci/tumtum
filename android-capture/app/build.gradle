plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'cc.tumtum.capture'
    // 36 because connect-client 1.1.0 refuses anything lower (the published
    // AAR metadata demands 36 and AGP 8.9.1+, whatever the docs say).
    // targetSdk stays 34: compiling against new APIs and opting into new
    // behaviour are different decisions, and the second deserves its own
    // test pass.
    compileSdk 36

    /*
      A signing key that does not change between builds.

      With no signingConfig at all, Gradle falls back to ~/.android/debug.keystore
      and *generates it at random* when the file is missing. Every CI run is a
      fresh machine, so every APK was signed by a different key — and Android
      refuses to install an update whose signature does not match the installed
      app. The symptom is a bare "App nao instalado" after the person has
      already agreed to install it, with nothing naming the real cause.

      That is not cosmetic for a pilot. It means the app can only be updated by
      uninstalling first, and uninstalling destroys whatever capture the service
      is still holding in memory — the worst possible instruction to give
      somebody after a six-hour show.

      The keystore is committed on purpose. It signs debug builds of an app
      installed by hand, its password is the conventional one, and it holds
      nothing secret. The trade-off, stated plainly: anyone with this repository
      can build an APK that Android would accept as an update to this one, which
      matters only to somebody who can also get it onto the phone. That is an
      acceptable trade for a hand-installed pilot and would not be for a store
      release, which needs a real release key kept out of the repository.
    */
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        /*
          The release key, kept out of the repository — 2026-09-17.

          From 30/09 an APK from an unverified developer no longer installs on
          a Brazilian phone, and the Play Console will not take the committed
          debug key at all. This is the upload key: Play App Signing holds the
          definitive one, so losing this key is a support request, not a lost
          app. CI decodes it from a secret into a temp file; locally, point
          the same four variables at a keystore on disk.
        */
        release {
            def keystorePath = System.getenv('TUMTUM_UPLOAD_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('TUMTUM_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('TUMTUM_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('TUMTUM_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId 'cc.tumtum.capture'
        // Android 8. Anything older cannot hold a foreground service the way
        // a six-hour capture needs.
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '0.2.1'
    }

    buildTypes {
        debug {
            // Installed by hand; the build the pilot ran on until 2026-09-17.
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.debug
        }
        release {
            // The build that goes to the Play Console (as an .aab) and, signed
            // with the same key, the APK a verified developer may hand out.
            // No shrinking: a WebView plus BLE plus Health Connect is exactly
            // the kind of app R8 breaks silently, and nothing here is large.
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// A release build without the key would be an unsigned bundle nobody can
// use, so it fails here, naming what is missing, rather than in the
// Play Console with a generic error.
afterEvaluate {
    tasks.matching { it.name in ['bundleRelease', 'assembleRelease', 'packageRelease'] }.configureEach {
        doFirst {
            if (!System.getenv('TUMTUM_UPLOAD_KEYSTORE_PATH')) {
                throw new GradleException(
                    'Release build needs the upload key: set TUMTUM_UPLOAD_KEYSTORE_PATH, ' +
                    '_KEYSTORE_PASSWORD, _KEY_ALIAS and _KEY_PASSWORD (see .github/workflows/build-capture-apk.yml).'
                )
            }
        }
    }
}

// The zero-dependency rule served until 2026-08-27, when Health Connect ended
// it: its client requires AndroidX and its permission flow requires
// ComponentActivity, and there is no framework-only way to read another app's
// heart-rate data. The rule's successor is narrower but still a rule: every
// runtime dependency here must be one Health Connect forces, nothing else.
// JUnit and org.json remain test-only and never ship in the APK.
dependencies {
    // ComponentActivity, so the Health Connect permission contract can launch.
    implementation 'androidx.activity:activity:1.9.3'
    // The Health Connect client itself (1.1.0 stable, Oct 2025; stage 2 uses it, stage 1 only carries it).
    implementation 'androidx.health.connect:connect-client:1.1.0'
    // connect-client is Kotlin coroutines end to end; -android brings the
    // main-thread dispatcher the permission callbacks land on.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    // Android ships org.json, but the stub on the unit-test classpath throws
    // on every call. AccessToken reads a JWT payload with it, so the tests
    // need a real implementation. Test-only: it never reaches the APK.
    testImplementation 'org.json:json:20240303'
}
