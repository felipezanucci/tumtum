# Ruff's default rule set changes between releases, so CI was linting against
# "whatever shipped today" — the same commit could go from clean to a hundred
# findings overnight with no code change. Both the rules and the version (in
# .github/workflows/ci.yml) are pinned so the check means the same thing twice.

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",   # imports
    "E7",   # statement style
    "E9",   # runtime errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "SIM",  # simplifications
    "PIE",  # misc lints
    "B",    # bugbear
    "RUF",  # ruff-specific
]

ignore = [
    # The codebase is written in English but its user-facing strings are
    # Brazilian Portuguese, and the algorithm docs use real mathematical
    # notation ("z-score × duration"). RUF001-003 flag those characters as
    # confusable with ASCII lookalikes — here they are simply the right
    # characters, and "fixing" them would corrupt the text.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency-injection design puts a call in the default
# argument — `user: User = Depends(get_current_user)`. B008 exists to catch
# mutable defaults evaluated once at import; these are the framework working as
# intended, and rewriting fifty signatures to silence it would make the code
# worse. This is the configuration Ruff documents for FastAPI.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]
