<!-- @dsCard group="App TumTum" viewport="440x920" subtitle="Core loop interativo: Ao vivo → Revela → Escolha → Card" -->
<!doctype html>
<html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>body{margin:0;background:#141414;font-family:var(--font-ui)}</style>
</head><body><div id="root"></div>
<script>
window.__NS = (() => {
  for (const k of Object.getOwnPropertyNames(window)) {
    try { const v = window[k];
      if (v && typeof v === "object" && typeof v.LiveScreen === "function" && typeof v.ShareCard === "function") return v;
    } catch (e) {}
  }
  return {};
})();
</script>
<script type="text/babel">
const { LiveScreen, RevealScreen, ChooseScreen, CardScreen } = window.__NS;
const STEPS = ["live", "reveal", "choose", "card"];
const LABELS = { live: "AO VIVO", reveal: "A REVELA", choose: "ESCOLHA", card: "O CARD" };
function App() {
  const [step, setStep] = React.useState("live");
  const [skin, setSkin] = React.useState("pink");
  const [posted, setPosted] = React.useState(false);
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 14, padding: "18px 0 24px" }}>
      <div style={{ display: "flex", gap: 8 }}>
        {STEPS.map(s => (
          <span key={s} onClick={() => { setStep(s); setPosted(false); }} style={{
            fontSize: 10, fontWeight: 700, letterSpacing: ".1em", cursor: "pointer", padding: "6px 10px",
            background: step === s ? "var(--tt-pink)" : "transparent",
            color: step === s ? "#000" : "#8A8A8A",
            border: step === s ? "none" : "1px solid #2E2E2E" }}>{LABELS[s]}</span>
        ))}
      </div>
      <div style={{ width: 393, height: 830, background: "#000", borderRadius: 28, overflow: "hidden", border: "1px solid #2E2E2E", position: "relative" }}>
        <div style={{ height: "100%" }}>
          {step === "live" && <LiveScreen onEnd={() => setStep("reveal")} />}
          {step === "reveal" && <RevealScreen onShare={() => setStep("choose")} />}
          {step === "choose" && <ChooseScreen onPick={s => { setSkin(s); setPosted(false); setStep("card"); }} />}
          {step === "card" && <CardScreen skin={skin} posted={posted} onBack={() => setStep("choose")} onPost={() => setPosted(true)} />}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
